<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070d4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رهنورد">
<title>شفاخانه رهنورد</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#070d4a;--navy-2:#141c6b;--orange:#f08a0c;--orange-soft:#fff1de;--bg:#f2f4fa;--card:#fff;--ink:#151a3a;--muted:#5d6385;--line:#dfe3f0;--radius:16px;
  --green:#1f9d4d;--green-soft:#eaf8ee;--red:#d93a3a;--red-soft:#fdecec;--blue-soft:#e3efff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-size:17px;margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.7;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:44px;height:auto;background:#fff;border-radius:10px;padding:3px}
.brand b{font-size:19px;font-weight:800;line-height:1.3}
.langs{display:flex;gap:6px;margin-top:10px;background:rgba(255,255,255,.1);padding:4px;border-radius:999px}
.langs button{flex:1;border:0;background:transparent;color:#fff;padding:9px 4px;border-radius:999px;font-weight:700;font-size:17px}
.langs button[aria-pressed="true"]{background:var(--orange);color:#1a1200}

.hero{position:relative;height:230px;overflow:hidden;background:var(--navy)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 40%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,13,74,.05) 30%,rgba(7,13,74,.88))}
.hero .txt{position:absolute;z-index:3;inset-inline:16px;bottom:14px;color:#fff}
.hero h1{margin:0;font-size:27px;font-weight:800;line-height:1.35}
.hero p{margin:2px 0 0;font-size:17px;opacity:.92}

.strip{margin:14px 14px 0;background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:12px;border-inline-start:6px solid var(--orange)}
.strip .i{font-size:28px}
.strip .t{flex:1;font-weight:800;font-size:19px;line-height:1.4}
.strip .t span{display:block;font-weight:400;font-size:16px;opacity:.9}
.strip a{background:var(--orange);color:#1a1200;text-decoration:none;font-weight:800;padding:11px 16px;border-radius:12px;font-size:17px;white-space:nowrap}

main{padding:0 14px}
h2{font-size:23px;font-weight:800;margin:24px 2px 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile{border:0;border-radius:18px;padding:14px 12px;color:#fff;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:112px;box-shadow:0 3px 10px rgba(7,13,74,.18)}
.tile .em{font-size:34px;line-height:1}
.tile .tt{font-weight:800;font-size:19px;line-height:1.4}
.tile.t1{background:linear-gradient(135deg,#141c6b,#2a3aa8)}
.tile.t2{background:linear-gradient(135deg,#17803f,#2fb35e)}
.tile.t3{background:linear-gradient(135deg,#8a2f6b,#c24a93)}
.tile.t4{background:linear-gradient(135deg,#0b6f8a,#1aa3c4)}
.tile.t5{background:linear-gradient(135deg,#b3261e,#e8514a)}
.tile.t6{background:linear-gradient(135deg,#b86300,#f08a0c)}

.search{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;font:inherit;font-size:18px;color:var(--ink)}
.search:focus{border-color:var(--navy);outline:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dep{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:start;display:flex;flex-direction:column;gap:8px;min-height:124px}
.dep:active{background:var(--orange-soft)}
.dep .ic{width:50px;height:50px;border-radius:14px;background:var(--navy);display:grid;place-items:center;font-size:27px}
.dep .nm{font-weight:700;font-size:18px;line-height:1.45}
.dep:nth-child(3n+2) .ic{background:var(--navy-2)}
.dep:nth-child(3n) .ic{background:#b86300}
.empty{text-align:center;color:var(--muted);padding:24px}

.contact{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:8px}
.contact a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:700;font-size:18px;padding:13px 14px;border-radius:12px;background:var(--bg)}
.contact .ph{direction:ltr;unicode-bidi:embed}
.contact svg{width:30px;height:30px;flex:none}
.note{color:var(--muted);font-size:16px;margin:8px 2px 0}
footer{text-align:center;color:var(--muted);font-size:14px;margin:28px 0 8px}

.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-weight:800;font-size:16px;padding:12px 6px;border-radius:13px;color:#fff;background:var(--navy)}
.bar a.call{background:var(--orange);color:#1a1200;flex:1.2}
.bar a.wa{background:#25D366}.bar a.fb{background:#1877F2}
.bar svg{width:24px;height:24px;flex:none}

/* ---- sheet ---- */
.ov{position:fixed;inset:0;z-index:50;background:rgba(7,13,74,.55);display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;position:sticky;top:-16px;background:#fff;padding:6px 0;z-index:2}
.hd .ic{width:48px;height:48px;border-radius:14px;background:var(--navy);display:grid;place-items:center;font-size:26px;flex:none}
.hd h3{margin:0;font-size:22px;font-weight:800;flex:1;line-height:1.4}
.x{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:19px;flex:none}
.sheet h4{margin:14px 0 8px;font-size:17px;color:var(--muted);font-weight:600}
.sheet ul.svcs,.sheet ul.plain{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.svcs li{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:14px;font-size:19px;font-weight:700;line-height:1.6}
.svcs li:nth-child(odd){background:#fff;color:#0b1a6b;border:1.5px solid #dfe3f0}
.svcs li:nth-child(even){background:var(--blue-soft);color:#0a3f9c;border:1.5px solid #c4daf9}
.cta{display:block;margin-top:16px;text-align:center;text-decoration:none;background:var(--orange);color:#1a1200;font-weight:800;font-size:18px;padding:15px;border-radius:14px}
.hnote{background:var(--orange-soft);border-radius:12px;padding:10px 12px;font-size:15px;color:#6a4400;margin:4px 0 10px}
.dnote{background:var(--blue-soft);border-radius:12px;padding:8px 12px;font-size:15px;color:#0a3f9c;margin:0 0 10px}

/* list rows */
.rows{display:grid;gap:8px;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 14px;border-radius:14px;font-size:19px;font-weight:700;border:1.5px solid #dfe3f0;background:#fff;color:#0b1a6b}
.rows .row:nth-child(even){background:var(--blue-soft);border-color:#c4daf9;color:#0a3f9c}
.row .em{font-size:26px;flex:none}
.row .tx{flex:1}
.row .chev{color:var(--orange);font-size:22px;flex:none}
[dir="rtl"] .row .chev{transform:scaleX(-1)}
.gh{margin:18px 2px 4px;font-size:18px;font-weight:800;color:var(--navy)}
.sheet .search{margin:6px 0 4px}

/* Q&A */
.qa{border-radius:16px;overflow:hidden;border:1.5px solid #c4daf9;margin-bottom:12px}
.qa .q{background:var(--navy);color:#fff;padding:12px 14px;font-weight:800;font-size:18px;line-height:1.5}
.qa:nth-of-type(even) .q{background:#0a3f9c}
.qa .a{padding:12px 14px;font-size:18px;line-height:1.85;background:#fff}
.qa ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.qa li{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:11px;font-weight:600;background:var(--bg)}
.qa.no .a li{background:var(--red-soft)}
.qa.yes .a li{background:var(--green-soft)}
.qa.warn .a li{background:#fff4d6}
.qa.test .a li{background:var(--blue-soft)}

/* diet */
.tip{background:var(--orange-soft);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:600;margin:6px 0 14px}
.box{border-radius:18px;padding:12px;margin-bottom:14px}
.box h5{margin:0 0 10px;font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px}
.box.g{background:var(--green-soft);border:3px solid var(--green)}.box.g h5{color:#116a31}
.box.r{background:var(--red-soft);border:3px solid var(--red)}.box.r h5{color:#a31f1f}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fi{background:#fff;border-radius:14px;padding:10px 8px;text-align:center;font-weight:700;font-size:17px;line-height:1.45;border:1.5px solid rgba(0,0,0,.06)}
.fi .em{display:block;font-size:38px;line-height:1.2;margin-bottom:2px}

/* lab */
details.grp{border:1.5px solid #c4daf9;border-radius:14px;margin-bottom:10px;overflow:hidden;background:#fff}
details.grp summary{cursor:pointer;list-style:none;padding:14px;font-weight:800;font-size:19px;color:#fff;background:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:8px}
details.grp:nth-of-type(even) summary{background:#0a3f9c}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .n{background:rgba(255,255,255,.2);border-radius:999px;padding:0 10px;font-size:15px}
.lr{padding:10px 14px;border-top:1px solid var(--line)}
.lr:nth-child(odd){background:#fff}.lr:nth-child(even){background:var(--blue-soft)}
.lr .ab{font-weight:800;font-size:19px;color:#0b1a6b}
.lr .full{font-size:16px;color:#33406e;text-align:start;unicode-bidi:plaintext}
.lr .fa{font-size:15px;color:var(--muted)}
.lr .ab bdi{direction:ltr}

[hidden]{display:none!important}
.box.y{background:#fff8e1;border:3px solid #f0a30a}.box.y h5{color:#8a5a00}
.box h5 .cnt{margin-inline-start:auto;font-size:15px;font-weight:700;background:rgba(0,0,0,.08);border-radius:999px;padding:0 10px}
.tile.t7{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;min-height:84px;background:linear-gradient(135deg,#070d4a,#141c6b);border:2px solid var(--orange)}
.tile.t7 .em{font-size:40px}
.num{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800;flex:none}
.pp{font-size:19px;line-height:1.95;margin:10px 2px}
.phold{background:#fff4d6;border:2px dashed #e0a100;color:#7a5200;border-radius:12px;padding:10px 12px;font-size:17px;font-weight:600;margin:10px 0}
.pl{list-style:none;margin:8px 0;padding:0;display:grid;gap:7px}
.pl li{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:11px;font-weight:600;background:var(--bg);font-size:18px}
.pl a{color:#0a3f9c;font-weight:800;text-decoration:none}
.acard{background:var(--blue-soft);border:2px solid #c4daf9;border-radius:18px;padding:12px;margin:6px 0 12px}
.acard.on{background:var(--green-soft);border-color:var(--green)}
.abtns{display:flex;gap:10px}
.abtn{flex:1;border:0;border-radius:14px;padding:14px 10px;font-weight:800;font-size:19px;color:#fff}
.abtn.play{background:var(--navy)}.abtn.stop{background:var(--red)}
.astat{min-height:24px;margin-top:8px;font-size:17px;font-weight:700;color:#0a3f9c}
.astat.err{color:#a31f1f}
.eq{display:none;gap:4px;height:22px;align-items:flex-end;margin-top:6px}
.acard.on .eq{display:flex}
.eq i{display:block;width:6px;background:var(--green);border-radius:3px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:5px}50%{height:22px}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:14px}}
.share{display:grid;gap:12px;margin-top:12px}
.sb{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:18px;color:#fff;font-weight:800;font-size:22px;padding:20px 14px;width:100%}
.sb svg{width:38px;height:38px;flex:none}
.sb.tgb{background:#26A5E4}.sb.wab{background:#25D366}
.shareq{font-size:18px;font-weight:600;margin:6px 0 8px}
.danger li{background:var(--red-soft);border:1.5px solid #f3b9b9;color:#7a1414}

@media (prefers-reduced-motion:reduce){.sheet{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><img src="logo.png" alt=""><b id="brandName"></b></div>
  <div class="langs" role="group" aria-label="Language">
    <button data-l="fa">دری</button><button data-l="ps">پښتو</button><button data-l="en">English</button>
  </div>
</header>

<section class="hero">

<main>

  <input id="q" class="search" type="search" autocomplete="off">
  <div id="deps" class="grid" style="margin-top:12px"></div>
  <div id="none" class="empty" hidden></div>

  <h2 id="hCon"></h2>
  <div class="contact" id="contact"></div>
  <p class="note" id="note"></p>
  <footer id="foot"></footer>
</main>

<nav class="bar">
  <a class="call" id="bCall" href="#"></a>
  <a id="bWa" class="wa" href="#" data-ext></a>
  <a id="bFb" class="fb" href="#" data-ext></a>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="health-diseases.js"></script>

    document.documentElement.dir = lang !== "en" ? "rtl" : "ltr";
    document.title = t(H.name);
    document.querySelectorAll(".langs button").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.l === lang ? "true" : "false"); });
    $("brandName").textContent = t(H.name);
    $("heroName").textContent = t(H.name);
    $("heroTag").textContent = t(H.tagline);
    $("stHours").textContent = t(U.hours);
    $("stAmb").textContent = t(U.ambulance);
    $("stCall").textContent = t(U.call);
    $("stCall").href = "tel:" + H.phone;
    $("q").placeholder = "🔎 " + t(U.search);
    $("hDep").textContent = t(U.departments);
    $("hCon").textContent = t(U.contact);
    $("note").textContent = t(U.note);
    $("foot").innerHTML = "<b>" + esc(t(U.developer)) + "</b>";
    $("bCall").textContent = "📞 " + t(U.call);
    $("bWa").innerHTML = icoWA("#fff") + "<span>" + esc(t(U.whatsapp)) + "</span>";
    $("bFb").innerHTML = icoFB("#fff") + "<span>" + esc(t(U.facebook)) + "</span>";
    $("bCall").href = "tel:" + H.phone;
    $("bWa").href = "https://wa.me/" + H.whatsapp;
    $("bFb").href = H.facebook;
    $("tiles").innerHTML = TILES.map(function(x){
      return '<button class="tile ' + x[0] + '" data-act="' + x[3] + '"><span class="em">' + x[1] + '</span><span class="tt">' + esc(t(U[x[2]])) + '</span></button>';
    }).join("");
    renderDeps();
    var rows = ['<a href="tel:' + H.phone + '">📞 <span class="ph">' + esc(H.phoneShow) + '</span></a>',
      '<a href="https://wa.me/' + H.whatsapp + '" data-ext>' + icoWA("#25D366") + esc(t(U.whatsapp)) + '</a>',
      '<a href="' + esc(H.facebook) + '" data-ext>' + icoFB("#1877F2") + esc(t(U.facebook)) + '</a>'];
    var addr = t(H.address); if (addr) rows.push('<a href="#" onclick="return false">📍 ' + esc(addr) + '</a>');
    $("contact").innerHTML = rows.join("");
  }

  function renderDeps(){
    var q = $("q").value.trim().toLowerCase();
    var list = D.departments.filter(function(d){
      if (!q) return true;
      var hay = [d.name.fa, d.name.ps, d.name.en].concat(d.services.map(function(s){ return s.fa + " " + s.ps + " " + s.en; })).join(" ").toLowerCase();
      return hay.indexOf(q) > -1;
    });
    $("deps").innerHTML = list.map(function(d){
      return '<button class="dep" data-act="dep" data-i="' + d.id + '"><span class="ic">' + d.icon + '</span><span class="nm">' + esc(t(d.name)) + '</span></button>';
    }).join("");
    $("none").hidden = list.length > 0; $("none").textContent = t(U.none);
  }

  /* ---------- sheet navigation ---------- */
  var stack = [];
  function backArrow(){ return lang === "en" ? "←" : "→"; }
  function draw(){
    stopAudio();
    var v = stack[stack.length-1];
    var back = stack.length > 1 ? '<button class="x" data-act="back" aria-label="' + esc(t(U.back)) + '">' + backArrow() + '</button>' : '';
    $("sheet").innerHTML = '<div class="hd">' + back + '<span class="ic">' + v.icon + '</span><h3>' + esc(v.title) + '</h3><button class="x" data-act="close" aria-label="' + esc(t(U.close)) + '">✕</button></div>' + v.body();
    $("sheet").scrollTop = 0;
  }
  function push(v){
    stack.push(v); draw(); $("ov").classList.add("on");
    if (tg && tg.BackButton) { try { tg.BackButton.show(); tg.BackButton.offClick(pop); tg.BackButton.onClick(pop); } catch(e){} }
  }
  function pop(){
    stack.pop();
    if (!stack.length) {
      stopAudio();
      $("ov").classList.remove("on");
      if (tg && tg.BackButton) { try { tg.BackButton.hide(); tg.BackButton.offClick(pop); } catch(e){} }
    } else draw();
  }
  function closeAll(){ stopAudio(); stack = []; $("ov").classList.remove("on"); if (tg && tg.BackButton) { try { tg.BackButton.hide(); tg.BackButton.offClick(pop); } catch(e){} } }

  function cta(){ return '<a class="cta" href="tel:' + H.phone + '">📞 ' + esc(t(U.call)) + ' · <span style="direction:ltr;unicode-bidi:embed">' + esc(H.phoneShow) + '</span></a>'; }
  function notes(){ return '<div class="hnote">⚕️ ' + esc(t(U.healthNote)) + '</div>' + (lang !== "fa" ? '<div class="dnote">ℹ️ ' + esc(t(U.dariOnly)) + '</div>' : ""); }
  function li(icon, txt){ return '<li><span>' + icon + '</span><span>' + esc(txt) + '</span></li>'; }
  function ul(items, icon, cls){ return '<ul class="' + (cls || "") + '">' + items.map(function(x){ return li(icon, x); }).join("") + '</ul>'; }

  /* departments */
  function depView(id){
    var d = D.departments.filter(function(x){ return x.id === id; })[0]; if (!d) return;
    return { icon: d.icon, title: t(d.name), body: function(){
      return '<h4>' + esc(t(U.services)) + '</h4><ul class="svcs">' + d.services.map(function(s){ return '<li><span>✅</span><span>' + esc(t(s)) + '</span></li>'; }).join("") + '</ul>' + cta();
    }};
  }

  /* lab & radiology */
  function labListView(){
    return { icon: "🔬", title: t(U.tLab), body: function(){
      return '<div class="rows">' + D.diagnostics.map(function(x){
        return '<button class="row" data-act="dx" data-i="' + x.id + '"><span class="em">' + x.icon + '</span><span class="tx">' + esc(t(x.name)) + '</span><span class="chev">‹</span></button>';
      }).join("") + '</div>';
    }};
  }
  function dxView(id){
    var x = D.diagnostics.filter(function(y){ return y.id === id; })[0]; if (!x) return;
    return { icon: x.icon, title: t(x.name), body: function(){
      return x.groups.map(function(g){
        return '<details class="grp"><summary><span>' + esc(t(g.title)) + '</span><span class="n">' + g.items.length + '</span></summary>' +
          g.items.map(function(it){
            return '<div class="lr"><div class="ab">✅ <bdi>' + esc(it[0]) + '</bdi></div><div class="full">' + esc(it[1]) + '</div><div class="fa">' + esc(it[2]) + '</div></div>';
          }).join("") + '</details>';
      }).join("") + cta();
    }};
  }

  /* diseases */
  function disListHtml(q){
    q = (q || "").trim();
    var out = [];
    DIS.forEach(function(d, i){
      if (q && (d.name + " " + d.def).indexOf(q) < 0) return;
      out.push('<button class="row" data-act="dis" data-i="' + i + '"><span class="em">' + d.icon + '</span><span class="tx">' + esc(d.name) + '</span><span class="chev">‹</span></button>');
    });
    return out.length ? out.join("") : '<div class="empty">' + esc(t(U.none)) + '</div>';
  }
  function disListView(){
    return { icon: "📚", title: t(U.tDiseases), body: function(){
      return notes() + '<input id="dsq" class="search" type="search" autocomplete="off" placeholder="🔎 ' + esc(t(U.searchDisease)) + '"><div class="rows" id="dlist">' + disListHtml("") + '</div>';
    }};
  }
  function disView(i){
    var d = DIS[i]; if (!d) return;
    return { icon: d.icon, title: d.name, body: function(){
      function qa(cls, q, a){ return '<div class="qa ' + cls + '"><div class="q">' + esc(q) + '</div><div class="a">' + a + '</div></div>'; }
      return notes() +
        qa("", d.name + " چیست؟", esc(d.def)) +
        qa("", d.name + " چگونه به وجود می‌آید؟", esc(d.cause)) +
        qa("", "علایم " + d.name + " چیست؟", ul(d.signs, "🔸")) +
        qa("no", "چه کارها نکنیم؟", ul(d.dont, "⛔")) +
        qa("yes", "چه کارها بکنیم؟", ul(d.do, "✅")) +
        qa("warn", "خطرات " + d.name + " چیست؟", ul(d.risks, "⚠️")) +
        qa("", "برای معاینه نزد کدام داکتر مراجعه کنیم؟", "👨‍⚕️ " + esc(d.doctor)) +
        qa("test", "کدام معاینات لازم است؟", ul(d.tests, "🔬")) + cta();
    }};
  }

  /* diet (دری / پښتو / English) — سه فهرست: ممنوع، به‌اندازه، توصیه‌شده */
  var I18N = window.DIET_I18N || { names: [], tips: [] };
  var FOODS = window.FOODS || {};
  function li3(arr, i){ return lang === "fa" ? null : (arr[i] ? arr[i][lang === "ps" ? 0 : 1] : null); }
  function dName(i){ return li3(I18N.names, i) || DIET[i].name; }
  function dTip(i){ return li3(I18N.tips, i) || DIET[i].tip; }
  function fName(k){ var f = FOODS[k]; if (!f) return k; return lang === "ps" ? f[2] : (lang === "en" ? f[3] : f[1]); }
  function dietListView(){
    return { icon: "🥗", title: t(U.tDiet), body: function(){
      return '<div class="hnote">⚕️ ' + esc(t(U.healthNote)) + '</div><div class="rows">' + DIET.map(function(d, i){
        return '<button class="row" data-act="diet" data-i="' + i + '"><span class="em">' + d.icon + '</span><span class="tx">' + esc(t(U.dietPrefix) + dName(i)) + '</span><span class="chev">‹</span></button>';
      }).join("") + '</div>';
    }};
  }
  function dietView(i){
    var d = DIET[i]; if (!d) return;
    return { icon: d.icon, title: t(U.dietPrefix) + dName(i), body: function(){
      function box(cls, icon, title, keys){
        return '<div class="box ' + cls + '"><h5>' + icon + ' ' + esc(t(title)) + '<span class="cnt">' + keys.length + '</span></h5><div class="fg">' +
          keys.map(function(k){ var f = FOODS[k] || ["🍽️"]; return '<div class="fi"><span class="em">' + f[0] + '</span>' + esc(fName(k)) + '</div>'; }).join("") + '</div></div>';
      }
      return '<div class="hnote">⚕️ ' + esc(t(U.healthNote)) + '</div><div class="tip">💡 ' + esc(dTip(i)) + '</div>' +
        box("r", "⛔", U.dietAvoid, d.avoid) + box("y", "⚠️", U.dietLimit, d.limit) + box("g", "✅", U.dietEat, d.eat) + cta();
    }};
  }

  /* sexual health */
  function sexListView(){
    return { icon: "💗", title: t(U.tSexual), body: function(){
      var groups = [["w", U.forWomen], ["m", U.forMen], ["b", U.forBoth]];
      return notes() + groups.map(function(g){
        var items = SEX.map(function(s, i){ return s.group === g[0] ? '<button class="row" data-act="sex" data-i="' + i + '"><span class="em">' + s.icon + '</span><span class="tx">' + esc(s.name) + '</span><span class="chev">‹</span></button>' : ""; }).join("");
        return '<div class="gh">' + esc(t(g[1])) + '</div><div class="rows">' + items + '</div>';
      }).join("");
    }};
  }
  function sexView(i){
    var s = SEX[i]; if (!s) return;
    return { icon: s.icon, title: s.name, body: function(){
      return notes() + s.blocks.map(function(b, k){
        var a = Array.isArray(b[1]) ? '<ul>' + b[1].map(function(x){ return li("🔹", x); }).join("") + '</ul>' : esc(b[1]);
        return '<div class="qa"><div class="q">' + esc(b[0]) + '</div><div class="a">' + a + '</div></div>';
      }).join("") + cta();
    }};
  }

  /* ---------- پروفایل شفاخانه + صدا ---------- */
  var PROF = D.profile || [];
  var player = null;
  function audioSrc(sec){ var a = sec.audio && (sec.audio[lang] || sec.audio.fa); return a ? (D.audioDir || "") + a : ""; }
  function setAudioUI(state, msg){
    var card = $("aCard"); if (!card) return;
    var pb = $("aPlay"), sb = $("aStop"), st = $("aStat");
    card.classList.toggle("on", state === "playing");
    if (pb) pb.hidden = state === "playing";
    if (sb) sb.hidden = state !== "playing";
    if (st) { st.textContent = state === "playing" ? "🔊 " + t(U.playing) : (msg || ""); st.className = "astat" + (state === "error" ? " err" : ""); }
  }
  function stopAudio(){
    if (player) {
      var a = player; player = null;
      try { a.onplay = a.onended = a.onerror = null; a.pause(); a.removeAttribute("src"); a.load(); } catch(e){}
    }
    setAudioUI("idle", "");
  }
  function playAudio(sec){
    stopAudio();
    var src = audioSrc(sec);
    if (!src) { setAudioUI("error", t(U.audioError)); return; }
    try {
      var a = new Audio(); player = a; a.preload = "auto";
      a.onplay = function(){ if (player === a) setAudioUI("playing"); };
      a.onended = function(){ if (player === a) { player = null; setAudioUI("idle", ""); } };
      a.onerror = function(){ if (player === a) { player = null; setAudioUI("error", t(U.audioError)); } };
      a.src = src;
      var pr = a.play();
      if (pr && pr.catch) pr.catch(function(){ if (player === a) { player = null; setAudioUI("error", t(U.audioError)); } });
    } catch(e){ player = null; setAudioUI("error", t(U.audioError)); }
  }
  function paras(arr){
    var out = "", bul = [];
    function flush(){ if (bul.length) { out += '<ul class="pl">' + bul.map(function(x){ return '<li><span>🔹</span><span>' + esc(x) + '</span></li>'; }).join("") + '</ul>'; bul = []; } }
    (arr || []).forEach(function(p){
      if (p.indexOf("• ") === 0) { bul.push(p.slice(2)); return; }
      flush();
      out += p.indexOf("⚠️") === 0 ? '<div class="phold">' + esc(p) + '</div>' : '<p class="pp">' + esc(p) + '</p>';
    });
    flush(); return out;
  }
  function bullets(items){ return '<ul class="pl">' + items.map(function(x){ return '<li><span>🔹</span><span>' + esc(x) + '</span></li>'; }).join("") + '</ul>'; }
  function autoBlock(kind){
    if (kind === "departments") return bullets(D.departments.map(function(d){ return d.icon + " " + t(d.name); }));
    if (kind === "lab" || kind === "imaging") { var x = D.diagnostics.filter(function(y){ return y.id === kind; })[0]; return x ? bullets(x.groups.map(function(g){ return t(g.title); })) : ""; }
    if (kind === "contact") {
      var r = [], ad = t(H.address);
      if (ad) r.push('<li><span>📍</span><span>' + esc(ad) + '</span></li>');
      r.push('<li><span>📞</span><a href="tel:' + H.phone + '" style="direction:ltr;unicode-bidi:embed">' + esc(H.phoneShow) + '</a></li>');
      r.push('<li><span>💬</span><a href="https://wa.me/' + H.whatsapp + '" data-ext>' + esc(t(U.whatsapp)) + ' · <span style="direction:ltr;unicode-bidi:embed">' + esc(H.phoneShow) + '</span></a></li>');
      r.push('<li><span>📘</span><a href="' + esc(H.facebook) + '" data-ext>' + esc(t(U.facebook)) + '</a></li>');
      return '<ul class="pl">' + r.join("") + '</ul>';
    }
    if (kind === "emergency") return '<a class="cta" style="background:var(--red);color:#fff" href="tel:' + H.phone + '">🚑 ' + esc(t(U.callNow)) + ' · <span style="direction:ltr;unicode-bidi:embed">' + esc(H.phoneShow) + '</span></a>';
    return "";
  }
  function profListView(){
    return { icon: "🏥", title: t(U.tProfile), body: function(){
      return '<div class="rows">' + PROF.map(function(s, i){
        return '<button class="row" data-act="prof" data-i="' + i + '"><span class="num">' + (i + 1) + '</span><span class="tx">' + esc(t(s.title)) + '</span><span class="chev">‹</span></button>';
      }).join("") + '</div>';
    }};
  }
  function profView(i){
    var s = PROF[i]; if (!s) return;
    return { icon: s.icon, title: (i + 1) + ". " + t(s.title), body: function(){
      var pick = function(o){ return o ? (o[lang] || o.fa || []) : []; };
      return '<div class="acard" id="aCard"><div class="abtns">' +
        '<button class="abtn play" id="aPlay" data-act="aplay" data-i="' + i + '">▶ ' + esc(t(U.play)) + '</button>' +
        '<button class="abtn stop" id="aStop" data-act="astop" hidden>⏹ ' + esc(t(U.stop)) + '</button></div>' +
        '<div class="astat" id="aStat" role="status" aria-live="polite">' + esc(t(U.listenHint)) + '</div>' +
        '<div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>' +
        paras(pick(s.intro)) + (s.auto ? autoBlock(s.auto) : "") + paras(pick(s.after));
    }};
  }

  /* danger */
  function dangerView(){
    return { icon: "🚨", title: t(U.tDanger), body: function(){
      return '<h4 style="color:#7a1414;font-size:18px">' + esc(t(U.dangerIntro)) + '</h4><ul class="svcs danger">' +
        D.danger.map(function(x){ return '<li><span>🚨</span><span>' + esc(t(x)) + '</span></li>'; }).join("") + '</ul>' + cta();
    }};
  }

  function shareView(){
    return { icon: "📤", title: t(U.tShare), body: function(){
      return '<p class="shareq">' + esc(t(U.shareHow)) + '</p><div class="share">' +
        '<button class="sb tgb" data-act="share-tg">' + icoTG("#fff") + '<span>' + esc(t(U.telegram)) + '</span></button>' +
        '<button class="sb wab" data-act="share-wa">' + icoWA("#fff") + '<span>' + esc(t(U.whatsapp)) + '</span></button></div>';
    }};
  }
  function shareTG(){
    var url = "https://t.me/share/url?url=" + encodeURIComponent(H.shareLink) + "&text=" + encodeURIComponent(t(U.shareText));
    if (tg && tg.openTelegramLink) { try { tg.openTelegramLink(url); return; } catch(e){} }
    window.open(url, "_blank");
  }
  function shareWA(){ openExternal("https://wa.me/?text=" + encodeURIComponent(t(U.shareText) + "\n" + H.shareLink)); }

  /* ---------- events ---------- */
  document.querySelector(".langs").addEventListener("click", function(e){ var b = e.target.closest("button"); if (b) setLang(b.dataset.l); });
  $("q").addEventListener("input", renderDeps);
  document.addEventListener("input", function(e){ if (e.target.id === "dsq") $("dlist").innerHTML = disListHtml(e.target.value); });
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if (el) {
      var a = el.dataset.act, i = el.dataset.i, v;
      if (a === "close") return closeAll();
      if (a === "back") return pop();
      if (a === "aplay") return playAudio(PROF[+i]);
      if (a === "astop") return stopAudio();
      if (a === "share-tg") return shareTG();
      if (a === "share-wa") return shareWA();
      if (a === "diseases") v = disListView();
      else if (a === "diet") v = el.dataset.i === undefined ? dietListView() : dietView(+i);
      else if (a === "sexual") v = sexListView();
      else if (a === "profile") v = profListView();
      else if (a === "prof") v = profView(+i);
      else if (a === "share") v = shareView();
      else if (a === "lab") v = labListView();
      else if (a === "danger") v = dangerView();
      else if (a === "dep") v = depView(i);
      else if (a === "dx") v = dxView(i);
      else if (a === "dis") v = disView(+i);
      else if (a === "sex") v = sexView(+i);
      if (v) push(v);
      return;
    }
    if (e.target.id === "ov") return closeAll();
    var ext = e.target.closest("a[data-ext]");
    if (ext) { e.preventDefault(); openExternal(ext.href); }
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeAll(); });
  document.addEventListener("visibilitychange", function(){ if (document.hidden) stopAudio(); });
  window.addEventListener("pagehide", stopAudio);

  render();
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
})();
</script>
</body>
</html>
